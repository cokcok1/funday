<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071a36"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="成人牧區相機"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.json"><title>出發啦！成人牧區｜漫畫相機</title><style>
*{box-sizing:border-box}body{margin:0;background:#071a36;color:white;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}#app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px max(8px,env(safe-area-inset-right)) 8px max(8px,env(safe-area-inset-left));gap:8px}.stage{width:min(100%,calc((100dvh - 90px)*1.7768));aspect-ratio:1672/941;position:relative;overflow:hidden;background:#0b1726;border-radius:8px}.stage video,.stage #still,.stage .photoBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.stage video.mirror{transform:scaleX(-1)}.stage #still{display:none}.stage #overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.stage .count{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:clamp(55px,20vw,180px);text-shadow:0 5px 15px #000;pointer-events:none}.controls{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}.controls button,.dialog button{background:#182d50;border:1px solid #6481ad;color:white;border-radius:12px;padding:9px 13px;min-height:44px}.controls button.primary{background:#fff;color:#10203d;border:4px solid #2881ef;border-radius:50%;height:62px;width:62px;font-size:26px;padding:0}.controls button:disabled{opacity:.4}.controls .active{background:#a46b00}#hint{font-size:12px;color:#c4d8fa;text-align:center;min-height:16px}.turn{display:none;position:fixed;inset:0;background:#071a36ed;z-index:20;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:22px}.dialog{position:fixed;inset:0;background:#000c;z-index:30;display:none;align-items:center;justify-content:center;padding:15px}.dialog.show{display:flex}.dialog .panel{max-width:450px;background:#132744;padding:20px;border-radius:16px;text-align:center}.dialog .panel button{margin:6px}#file{display:none}@media(orientation:portrait){.turn{display:flex}}@media(max-height:450px){#app{gap:3px}.controls button{min-height:38px;padding:6px 9px}.controls button.primary{height:48px;width:48px}}
</style></head><body><div id="app"><div class="stage" id="stage"><video id="video" autoplay playsinline muted></video><img id="still" alt="拍攝相片"><img id="overlay" src="frame.png" alt="漫畫相框"><div class="count" id="count"></div></div><div class="controls"><button id="camera">開啟相機</button><button id="flip">切換鏡頭</button><button id="timer">倒數：關</button><button id="frameBtn" class="active">相框：開</button><button id="shot" class="primary" aria-label="拍照">●</button><button id="upload">相簿匯入</button><button id="save" disabled>儲存相片</button><button id="share" disabled>分享</button><button id="reset" disabled>重拍</button></div><div id="hint">請橫放手機，按「開啟相機」並允許使用鏡頭。</div><input id="file" type="file" accept="image/*"><div class="turn">請將手機橫向放置 ↻<br><small>橫向拍照效果最佳</small></div></div><div class="dialog" id="dialog"><div class="panel"><p id="message"></p><button id="close">關閉</button></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const video=$('video'),still=$('still'),overlay=$('overlay'),hint=$('hint');let stream=null,facing='environment',countdown=0,frameOn=true,photo=null,blob=null,objectUrl=null,sourceImage=null;const W=1672,H=941;const say=t=>hint.textContent=t;const alertUser=t=>{$('message').textContent=t;$('dialog').classList.add('show')};$('close').onclick=()=>$('dialog').classList.remove('show');function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}async function start(){stop();clearPhoto();try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}}});video.srcObject=stream;video.classList.toggle('mirror',facing==='user');await video.play();say('鏡頭已啟動，可以拍照。')}catch(e){say('無法開啟相機。');alertUser('請在 HTTPS 網址（例如 GitHub Pages）使用，並允許瀏覽器存取相機。錯誤：'+e.message)}}function clearPhoto(){photo=null;sourceImage=null;blob=null;if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}still.style.display='none';video.style.display='block';$('save').disabled=true;$('share').disabled=true;$('reset').disabled=true}function drawCover(ctx,img,w,h,mirror=false){const iw=img.videoWidth||img.naturalWidth,ih=img.videoHeight||img.naturalHeight;if(!iw||!ih)throw Error('未有可用影像');const r=Math.max(w/iw,h/ih),sw=w/r,sh=h/r,sx=(iw-sw)/2,sy=(ih-sh)/2;ctx.save();if(mirror){ctx.translate(w,0);ctx.scale(-1,1)}ctx.drawImage(img,sx,sy,sw,sh,0,0,w,h);ctx.restore()}function compose(img,mirror=false){const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);drawCover(ctx,img,W,H,mirror);if(frameOn)ctx.drawImage(overlay,0,0,W,H);return canvas}async function output(canvas){return new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(Error('相片輸出失敗')),'image/jpeg',.94))}async function capture(){if(!stream&&!sourceImage){alertUser('請先開啟相機，或者從相簿匯入照片。');return}if(!sourceImage&&video.readyState<2){say('相機準備中，請稍後重試');return}try{if(countdown){for(let n=countdown;n>0;n--){$('count').textContent=n;await new Promise(r=>setTimeout(r,1000))}$('count').textContent=''}const img=sourceImage||video;photo=compose(img,!sourceImage&&facing==='user');blob=await output(photo);still.src=photo.toDataURL('image/jpeg',.9);still.style.display='block';video.style.display='none';$('save').disabled=false;$('share').disabled=false;$('reset').disabled=false;say('已拍攝！可以儲存或分享。')}catch(e){$('count').textContent='';alertUser(e.message)}}$('camera').onclick=start;$('flip').onclick=async()=>{facing=facing==='user'?'environment':'user';await start()};$('timer').onclick=()=>{countdown=countdown===0?3:countdown===3?5:0;$('timer').textContent='倒數：'+(countdown?countdown+'秒':'關')};$('frameBtn').onclick=()=>{frameOn=!frameOn;overlay.style.display=frameOn?'block':'none';$('frameBtn').textContent='相框：'+(frameOn?'開':'關');$('frameBtn').classList.toggle('active',frameOn);if(photo){const img=sourceImage||video;if(img===video&&video.style.display==='none'){say('更換相框後請按「重拍」再拍攝。')}else{photo=compose(img,!sourceImage&&facing==='user');output(photo).then(b=>{blob=b;still.src=photo.toDataURL('image/jpeg',.9)})}}};$('shot').onclick=capture;$('reset').onclick=()=>{clearPhoto();say('可以重新拍攝。')};$('upload').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;clearPhoto();const url=URL.createObjectURL(f);objectUrl=url;const img=new Image();img.onload=async()=>{sourceImage=img;photo=compose(img);blob=await output(photo);still.src=photo.toDataURL('image/jpeg',.9);still.style.display='block';video.style.display='none';$('save').disabled=false;$('share').disabled=false;$('reset').disabled=false;say('相簿照片已加入漫畫相框。')};img.onerror=()=>alertUser('無法讀取照片');img.src=url;e.target.value=''};function filename(){return '出發啦-成人牧區-'+new Date().toISOString().replace(/[:.]/g,'-')+'.jpg'}$('save').onclick=()=>{if(!blob)return;const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename();document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);say('已啟動下載；iPhone 可透過分享功能儲存到相片。')};$('share').onclick=async()=>{if(!blob)return;const f=new File([blob],filename(),{type:'image/jpeg'});try{if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:'出發啦！成人牧區'});else if(navigator.share)await navigator.share({title:'出發啦！成人牧區'});else alertUser('此瀏覽器不支援直接分享，請先儲存相片。')}catch(e){if(e.name!=='AbortError')alertUser('分享失敗：'+e.message)}};if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});window.addEventListener('pagehide',stop);})();
</script></body></html>
